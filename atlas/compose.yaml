services:
  atlasdb:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ohdsi
      POSTGRES_USER: webapi
      POSTGRES_PASSWORD: ${ATLAS_DB_PASSWORD:?Run extras/studies/StartAtlas.py}
    volumes:
      - atlasdb:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U webapi -d ohdsi"]
      interval: 5s
      timeout: 5s
      retries: 20
  webapi:
    image: ohdsi/webapi:2.15.2
    depends_on:
      atlasdb:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_OPTS: -Xms512m -Xmx4g
      DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      DATASOURCE_URL: jdbc:postgresql://atlasdb:5432/ohdsi
      DATASOURCE_USERNAME: webapi
      DATASOURCE_PASSWORD: ${ATLAS_DB_PASSWORD}
      DATASOURCE_OHDSI_SCHEMA: webapi
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA: webapi
      SPRING_BATCH_REPOSITORY_TABLEPREFIX: webapi.BATCH_
      FLYWAY_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      FLYWAY_DATASOURCE_URL: jdbc:postgresql://atlasdb:5432/ohdsi
      FLYWAY_DATASOURCE_USERNAME: webapi
      FLYWAY_DATASOURCE_PASSWORD: ${ATLAS_DB_PASSWORD}
      FLYWAY_LOCATIONS: classpath:db/migration/postgresql
      FLYWAY_SCHEMAS: webapi
      FLYWAY_PLACEHOLDERS_OHDSISCHEMA: webapi
      FLYWAY_TABLE: schema_history
      SECURITY_PROVIDER: DisabledSecurity
      SECURITY_CORS_ENABLED: "true"
      SECURITY_ORIGIN: http://localhost:18081
  atlas:
    image: ohdsi/atlas:2.15.0
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./config-local.js:/usr/share/nginx/html/atlas/js/config-local.js:ro
    entrypoint: [nginx, -g, "daemon off;"]
volumes:
  atlasdb: {}
