services:
  opal:
    image: obiba/opal:5.7.6@sha256:0483560a3084d43a687037b84f5c72249bf337a4bcb69b6ae50eac2fb4afd18f
    labels:
      org.federatedps.stage: C1
    environment:
      OPAL_ADMINISTRATOR_PASSWORD: ${C1_OPAL_PASSWORD:?Use a separate temporary env file}
      ROCK_HOSTS: rock1:8085,rock2:8085
      ROCK_ADMINISTRATOR_USER: administrator
      ROCK_ADMINISTRATOR_PASSWORD: ${C1_ROCK_PASSWORD:?Use a separate temporary env file}
      JAVA_OPTS: -Xms256m -Xmx1g
    volumes:
      - opal-home:/srv
    networks: [c1]
  rock1:
    image: ${C1_FEDERATEDPS_IMAGE:-federatedps-c1:local}
    build:
      context: ${C1_BUILD_CONTEXT:?Provide only the three source archives}
      dockerfile: ${C1_DOCKERFILE:?Absolute path to the approved Dockerfile}
    labels:
      org.federatedps.stage: C1
    environment:
      ROCK_ID: c1-site1
      R_LIBS_SITE: /opt/federatedps/library:/usr/local/lib/R/site-library:/usr/lib/R/site-library
      ROCK_CLUSTER: c1-site1
      ROCK_SECURITY_ENABLED: "true"
      ROCK_ADMINISTRATOR_NAME: administrator
      ROCK_ADMINISTRATOR_PASSWORD: ${C1_ROCK_PASSWORD:?Use a separate temporary env file}
      FEDERATEDPS_C1_INPUT: /opt/federatedps/input/site.rds
      FEDERATEDPS_DATA_MODE: ${FPS_DATA_MODE:-synthetic}
      JAVA_OPTS: -Xmx1g
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - rock1-home:/srv
      - rock1-input:/opt/federatedps/input
      - rock1-private:/opt/federatedps/private
    networks: [c1]
  rock2:
    image: ${C1_FEDERATEDPS_IMAGE:-federatedps-c1:local}
    labels:
      org.federatedps.stage: C1
    environment:
      ROCK_ID: c1-site2
      R_LIBS_SITE: /opt/federatedps/library:/usr/local/lib/R/site-library:/usr/lib/R/site-library
      ROCK_CLUSTER: c1-site2
      ROCK_SECURITY_ENABLED: "true"
      ROCK_ADMINISTRATOR_NAME: administrator
      ROCK_ADMINISTRATOR_PASSWORD: ${C1_ROCK_PASSWORD:?Use a separate temporary env file}
      FEDERATEDPS_C1_INPUT: /opt/federatedps/input/site.rds
      FEDERATEDPS_DATA_MODE: ${FPS_DATA_MODE:-synthetic}
      JAVA_OPTS: -Xmx1g
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - rock2-home:/srv
      - rock2-input:/opt/federatedps/input
      - rock2-private:/opt/federatedps/private
    networks: [c1]
  coordinator:
    image: ${C1_FEDERATEDPS_IMAGE:-federatedps-c1:local}
    profiles: [test]
    labels:
      org.federatedps.stage: C1
    entrypoint: [sleep, infinity]
    environment:
      C1_OPAL_PASSWORD: ${C1_OPAL_PASSWORD:?Use a separate temporary env file}
      C1_RESEARCH_PASSWORD: ${C1_RESEARCH_PASSWORD:?Use a separate temporary env file}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - coordinator-private:/opt/federatedps/private
    networks: [c1]
networks:
  c1:
    internal: true
    labels:
      org.federatedps.stage: C1
volumes:
  opal-home:
    labels:
      org.federatedps.stage: C1
  rock1-home:
    labels:
      org.federatedps.stage: C1
  rock2-home:
    labels:
      org.federatedps.stage: C1
  rock1-input:
    labels:
      org.federatedps.stage: C1
  rock2-input:
    labels:
      org.federatedps.stage: C1
  rock1-private:
    labels:
      org.federatedps.stage: real-data-private
  rock2-private:
    labels:
      org.federatedps.stage: real-data-private
  coordinator-private:
    labels:
      org.federatedps.stage: real-data-private
